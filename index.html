<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f4f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        padding: 3rem 4rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
      }

      p {
        margin: 1rem 0 0;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>Your local page is up and running.</p>
    </main>
  </body>
</html>
